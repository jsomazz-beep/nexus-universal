services:
  - type: web
    name: sinisa-sp-bi
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TABLE_NAME
        value: saneamento_sp_municipios_selecionados
