# =====================================================================
#  Intelligence Hub v2.0 — Configuração Principal
#  Copie para config.yaml e ajuste conforme necessário
# =====================================================================

project:
  name: intelligence_hub
  output_language: pt
  timezone: UTC
  max_news: 60
  report_title: "Strategic Intelligence Hub — Negócios, Infraestrutura e Oportunidades"
  report_theme: "dark"            # dark | light | boardroom

monitoring:
  regions:
    - Angola
    - Portugal
    - Brasil
    - Emirados Arabes Unidos
    - África

  region_aliases:
    Angola:          ["angola", "ao", "luanda", "angola investment"]
    Portugal:        ["portugal", "pt", "lisboa", "porto"]
    Brasil:          ["brasil", "brazil", "br", "são paulo", "rio de janeiro", "brasília"]
    Emirados Arabes Unidos: ["dubai", "uae", "united arab emirates", "emirados", "abu dhabi"]
    África:          ["africa", "african", "sub-saharan", "moçambique", "mozambique", "kenya",
                      "nigeria", "ghana", "south africa", "africa do sul"]

  themes:
    Economia:
      - economia
      - economic
      - pib
      - gdp
      - inflação
      - inflation
      - juros
      - interest rate
      - mercado
      - market
      - investimento
      - investment
      - crescimento
      - growth
      - recessão
      - recession

    Oportunidades:
      - licitação
      - tender
      - concession
      - concessão
      - ppp
      - procurement
      - contrato
      - contract
      - oportunidade
      - opportunity
      - bid
      - rfp
      - edital

    Infraestrutura:
      - infraestrutura
      - infrastructure
      - rodovia
      - highway
      - porto
      - port
      - aeroporto
      - airport
      - saneamento
      - sanitation
      - água
      - water
      - energia
      - energy
      - grid
      - pipeline

    Energia:
      - energia
      - energy
      - petróleo
      - oil
      - gás
      - gas
      - renovável
      - renewable
      - solar
      - wind
      - hidro
      - hydro
      - transição energética
      - energy transition

    Tecnologia:
      - tecnologia
      - technology
      - IA
      - artificial intelligence
      - machine learning
      - digitalização
      - digital transformation
      - startup
      - fintech
      - data center

    Mercado Financeiro:
      - bolsa
      - stock
      - ação
      - share
      - bonds
      - dívida
      - debt
      - câmbio
      - exchange rate
      - forex
      - crypto
      - bitcoin

    Geopolítica:
      - geopolítica
      - geopolitics
      - sanção
      - sanction
      - diplomacia
      - diplomacy
      - guerra
      - war
      - conflito
      - conflict
      - crise
      - crisis

    Facilities & Serviços:
      - facilities
      - gestão predial
      - building management
      - manutenção
      - maintenance
      - terceirização
      - outsourcing
      - frota
      - fleet management

  priority_keywords:
    - saneamento
    - facilities
    - licitação
    - concessão
    - frota
    - infraestrutura

  associated_keywords:
    - procurement
    - tender
    - investment
    - infrastructure
    - contract
    - concession
    - fleet
    - outsourcing

  negative_keywords:
    - entretenimento
    - esporte
    - futebol
    - celebrity
    - moda

  opportunity_signals:
    licitacao:          ["licitação", "edital", "pregão", "tender", "bid"]
    concessao:          ["concessão", "concession", "ppk"]
    ppp:                ["ppp", "parceria público-privada", "public private partnership"]
    investimento:       ["investimento", "capex", "aporte", "funding", "investment"]
    aquisicao:          ["aquisição", "acquisition", "m&a", "merger", "takeover"]
    obras_infra:        ["obras", "infraestrutura", "rodovia", "porto", "aeroporto", "pipeline"]
    saneamento:         ["saneamento", "água", "esgoto", "water treatment"]
    facilities:         ["facilities", "gestão predial", "manutenção predial"]
    renovacao_frota:    ["frota", "veículos", "fleet", "vehicles"]
    outsourcing:        ["terceirização", "outsourcing", "serviços terceirizados"]
    expansao:           ["expansão", "crescimento", "novo mercado", "market expansion"]
    parceria:           ["joint venture", "parceria estratégica", "strategic partnership"]
    marco_regulatorio:  ["marco regulatório", "regulação", "liberalização", "regulatory"]

# ── Filtros ────────────────────────────────────────────────────────────
filters:
  time_window_days: 7
  accepted_languages: ["any"]
  min_text_length: 40
  blocked_domains:
    - "spam.com"

# ── Deduplicação ───────────────────────────────────────────────────────
deduplication:
  title_similarity_threshold: 0.70
  url_exact_match: true

# ── Scoring ────────────────────────────────────────────────────────────
scoring:
  weights:
    recency:           0.20
    region_fit:        0.18
    theme_fit:         0.15
    priority_keywords: 0.15
    opportunity_signals: 0.15
    multi_source:      0.10
    content_quality:   0.05
    engagement:        0.02

# ── Runtime ────────────────────────────────────────────────────────────
runtime:
  output_dir: "output"
  log_dir: "logs"
  db_path: "data/hub.db"
  parallel_workers: 12
  per_source_timeout_seconds: 20
  log_level: "INFO"
  scheduler:
    day_of_week: "mon"
    hour: 7
    minute: 30
    timezone: "America/Sao_Paulo"

# ══════════════════════════════════════════════════════════════════════
#  FONTES DE NOTÍCIAS — 30+ fontes de 7 tipos diferentes
# ══════════════════════════════════════════════════════════════════════
sources:

  # ── GDELT Project (sem API key) ──────────────────────────────────────
  - id: gdelt_angola_infra
    type: gdelt
    enabled: true
    name: "GDELT — Angola Infraestrutura"
    region_hint: "Angola"
    query: "Angola infrastructure investment procurement"
    timespan: "7d"
    max_records: 50

  - id: gdelt_brasil_oportunidades
    type: gdelt
    enabled: true
    name: "GDELT — Brasil Oportunidades"
    region_hint: "Brasil"
    query: "Brazil infrastructure procurement licitacao concession investment"
    timespan: "7d"
    max_records: 50

  - id: gdelt_uae_business
    type: gdelt
    enabled: true
    name: "GDELT — UAE Negócios"
    region_hint: "Emirados Arabes Unidos"
    query: "UAE Dubai infrastructure investment business"
    timespan: "7d"
    max_records: 40

  - id: gdelt_africa_energy
    type: gdelt
    enabled: true
    name: "GDELT — África Energia"
    region_hint: "África"
    query: "Africa energy infrastructure investment development"
    timespan: "7d"
    max_records: 40

  # ── The Guardian (chave gratuita) ────────────────────────────────────
  - id: guardian_business
    type: guardian
    enabled: true
    name: "The Guardian — Business"
    region_hint: "Global"
    section: "business"
    page_size: 30

  - id: guardian_environment
    type: guardian
    enabled: true
    name: "The Guardian — Environment"
    region_hint: "Global"
    section: "environment"
    page_size: 20

  - id: guardian_africa
    type: guardian
    enabled: true
    name: "The Guardian — Africa"
    region_hint: "África"
    query: "Africa infrastructure investment"
    page_size: 20

  # ── Hacker News (sem API key) ────────────────────────────────────────
  - id: hackernews_tech
    type: hackernews
    enabled: true
    name: "Hacker News — Tech Trends"
    region_hint: "Global"
    tags: "story"
    hits_per_page: 30
    min_points: 100

  - id: hackernews_ai
    type: hackernews
    enabled: true
    name: "Hacker News — AI"
    region_hint: "Global"
    query: "artificial intelligence machine learning"
    tags: "story"
    hits_per_page: 20
    min_points: 50

  # ── Reddit (sem API key) ─────────────────────────────────────────────
  - id: reddit_worldnews
    type: reddit
    enabled: true
    name: "Reddit — World News"
    region_hint: "Global"
    subreddits: ["worldnews"]
    sort: "hot"
    limit: 25

  - id: reddit_economics
    type: reddit
    enabled: true
    name: "Reddit — Economics"
    region_hint: "Global"
    subreddits: ["economics", "investing"]
    sort: "hot"
