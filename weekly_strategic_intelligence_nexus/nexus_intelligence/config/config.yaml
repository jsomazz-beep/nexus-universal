project:
  name: nexus_intelligence
  version: "2.0"
  output_language: pt
  timezone: America/Sao_Paulo
  max_news: 80
  report_title: "Nexus Intelligence — Radar Global de Notícias"
  report_theme: dark
  include_images: true
  max_images: 12

monitoring:
  regions:
    - Brasil
    - Portugal
    - Angola
    - Emirados Arabes Unidos
    - Global
  region_aliases:
    Brasil: ["brasil", "brazil", "br", "sao paulo", "rio de janeiro", "brasilia"]
    Portugal: ["portugal", "pt", "lisboa", "porto"]
    Angola: ["angola", "ao", "luanda"]
    Emirados Arabes Unidos: ["dubai", "uae", "united arab emirates", "emirados", "abu dhabi"]
    Global: ["global", "mundial", "world", "international"]

  topics:
    Economia & Finanças:
      keywords: [economia, mercado, pib, inflação, juros, bolsa, investimento, fiscal, monetário, câmbio, economy, market, gdp, inflation, interest rate, investment, fiscal, monetary, currency, stocks]
      color: "#10b981"
      icon: "📈"
    Tecnologia & IA:
      keywords: [inteligência artificial, ia, machine learning, deep learning, llm, gpt, blockchain, cloud, cybersecurity, startup, venture capital, artificial intelligence, ai, tech, software, hardware, semiconductor]
      color: "#6366f1"
      icon: "🤖"
    Infraestrutura & Energia:
      keywords: [infraestrutura, energia, petróleo, gás, renovável, solar, eólico, porto, aeroporto, ferrovia, rodovia, infrastructure, energy, oil, gas, renewable, solar, wind, airport, railway, highway]
      color: "#f59e0b"
      icon: "⚡"
    Geopolítica & Diplomacia:
      keywords: [diplomacia, geopolítica, guerra, sanções, nato, onu, acordo, tratado, embaixada, diplomacy, geopolitics, war, sanctions, treaty, embassy, un, nato, conflict]
      color: "#ef4444"
      icon: "🌐"
    Saúde & Ciência:
      keywords: [saúde, medicina, vacina, pesquisa, ciência, farmacêutico, biotech, pandemia, health, medicine, vaccine, research, science, pharmaceutical, biotech, pandemic, clinical trial]
      color: "#06b6d4"
      icon: "🔬"
    Oportunidades & Negócios:
      keywords: [licitação, concessão, ppp, contrato, procurement, tender, bid, acquisition, merger, aquisição, fusão, parceria, joint venture, oportunidade, opportunity, facilities, outsourcing]
      color: "#8b5cf6"
      icon: "💼"
    Clima & Sustentabilidade:
      keywords: [clima, sustentabilidade, esg, carbono, emissões, verde, ambiental, climate, sustainability, carbon, emissions, green, environmental, cop, net zero]
      color: "#22c55e"
      icon: "🌱"

  priority_keywords:
    - licitação
    - concessão
    - ppp
    - investimento
    - infraestrutura
    - saneamento
    - facilities
    - aquisição
    - procurement
    - tender
    - concession

  opportunity_signals:
    licitacao: ["licitação", "edital", "pregão", "tender", "bid"]
    concessao: ["concessão", "concession"]
    ppp: ["ppp", "parceria público-privada", "public private partnership"]
    aquisicao: ["aquisição", "acquisition", "merger", "fusão"]
    investimento: ["investimento", "capex", "aporte", "investment", "funding"]
    infraestrutura: ["infraestrutura", "infrastructure", "construction", "obras"]
    saneamento: ["saneamento", "água", "esgoto", "sanitation", "water"]
    energia: ["energia", "energy", "power", "geração"]

filters:
  time_window_days: 7
  accepted_languages: ["any"]
  minimum_fields: ["title", "url", "published_at"]
  min_text_length: 60

deduplication:
  title_similarity_threshold: 0.82
  merge_window_hours: 48

scoring:
  weights:
    recency: 0.20
    region_fit: 0.15
    topic_fit: 0.10
    priority_keywords: 0.15
    opportunity_signals: 0.15
    source_authority: 0.10
    multi_source_recurrence: 0.10
    entities: 0.05

