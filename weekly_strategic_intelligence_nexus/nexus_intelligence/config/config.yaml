runtime:
  output_dir: "output"
  log_dir: "logs"
  history_file: "data/history.json"
  retries: 3
  retry_backoff_seconds: 2
  per_source_timeout_seconds: 25
  log_level: "INFO"
  keep_execution_history: true
  max_concurrent_sources: 10
  webapp_port: 8788
  scheduler:
    day_of_week: "mon"
    hour: 7
    minute: 30
    timezone: "America/Sao_Paulo"
